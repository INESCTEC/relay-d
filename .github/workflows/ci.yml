name: CI

# NOTE: This workflow deliberately does NOT install or exercise ROS 2 (rclpy,
# tf2_ros, cv_bridge, ROS 2 message packages). GitHub-hosted runners don't
# have ROS 2 preinstalled, and this project has no automated test suite for
# those code paths yet (see CONTRIBUTING.md). This workflow only sanity-checks
# that the pip-installable subset of the package builds and installs cleanly,
# plus a non-blocking lint report.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build & install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pyproject.toml
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb')); print('pyproject.toml is valid')"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install the package (pip-installable dependencies only)
        run: pip install .

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff (report-only, does not fail the build)
        run: ruff check --exit-zero .
