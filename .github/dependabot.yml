version: 2
updates:
  # Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # One grouped PR (one branch) per ecosystem, so the repo isn't flooded
    open-pull-requests-limit: 1
    groups:
      pip-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"

  # GitHub Actions workflow versions (actions/checkout, actions/setup-python, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
