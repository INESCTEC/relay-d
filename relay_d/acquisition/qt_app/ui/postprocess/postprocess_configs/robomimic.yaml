format:
  name: "robomimic"
  version: "1.0"
  description: "Robomimic dataset format for imitation learning"

output_structure:
  root_groups:
    - name: "data"
      groups:
        - name: "demo_{i}"
          datasets:
            - name: "states"
              shape: [num_samples, state_dim]
              dtype: "float32"
              description: "Environment states"
            - name: "actions"
              shape: [num_samples, action_dim]
              dtype: "float32"
              description: "Action sequences for robot control"
            - name: "rewards"
              shape: [num_samples]
              dtype: "float32"
              description: "Reward signals"
            - name: "dones"
              shape: [num_samples]
              dtype: "float32"
              description: "Episode termination flags"
          groups:
            - name: "obs"
              description: "Observations at current timestep"
              datasets:
                - name: "*_image"
                  shape: [num_samples, height, width, channels]
                  dtype: "uint8"
                  description: "Image observations from cameras"
                - name: "*_joint_pos"
                  shape: [num_samples, num_joints]
                  dtype: "float32"
                  description: "Joint position observations"
                - name: "*_joint_vel"
                  shape: [num_samples, num_joints]
                  dtype: "float32"
                  description: "Joint velocity observations"
                - name: "*_eef_pos"
                  shape: [num_samples, 3]
                  dtype: "float32"
                  description: "End effector position"
                - name: "*_eef_quat"
                  shape: [num_samples, 4]
                  dtype: "float32"
                  description: "End effector orientation quaternion"
                - name: "*_gripper_qpos"
                  shape: [num_samples, 2]
                  dtype: "float32"
                  description: "Gripper position"
                - name: "object_pos"
                  shape: [num_samples, 3]
                  dtype: "float32"
                  description: "Object translation"
                - name: "object_quat"
                  shape: [num_samples, 4]
                  dtype: "float32"
                  description: "Object rotation quaternion"
            - name: "next_obs"
              description: "Observations at next timestep"
              datasets:
                - name: "*_image"
                  shape: [num_samples, height, width, channels]
                  dtype: "uint8"
                  description: "Image observations from cameras (shifted)"
                - name: "*_joint_pos"
                  shape: [num_samples, num_joints]
                  dtype: "float32"
                  description: "Joint position observations (shifted)"
                - name: "*_joint_vel"
                  shape: [num_samples, num_joints]
                  dtype: "float32"
                  description: "Joint velocity observations (shifted)"
                - name: "*_eef_pos"
                  shape: [num_samples, 3]
                  dtype: "float32"
                  description: "End effector position (shifted)"
                - name: "*_eef_quat"
                  shape: [num_samples, 4]
                  dtype: "float32"
                  description: "End effector orientation quaternion (shifted)"
                - name: "*_gripper_qpos"
                  shape: [num_samples, 2]
                  dtype: "float32"
                  description: "Gripper position (shifted)"
                - name: "object_pos"
                  shape: [num_samples, 3]
                  dtype: "float32"
                  description: "Object translation (shifted)"
                - name: "object_quat"
                  shape: [num_samples, 4]
                  dtype: "float32"
                  description: "Object rotation quaternion (shifted)"
          attributes:
            - name: "num_samples"
              type: "int"
              description: "Number of timesteps in trajectory"
            - name: "model_file"
              type: "string"
              description: "Path to MJCF model file (for robosuite)"
      attributes:
        - name: "total"
          type: "int"
          description: "Total number of demos in dataset"
        - name: "env_args"
          type: "json"
          description: "Environment arguments in JSON format"
    - name: "mask"
      description: "Dataset filtering mask"
      datasets:
        - name: "valid"
          dtype: "string"
          description: "List of valid demo names"
