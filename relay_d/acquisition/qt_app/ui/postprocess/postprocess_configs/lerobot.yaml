format:
  name: "lerobot"
  version: "3.0"
  description: "LeRobotDataset v3.0 (parquet + mp4 + metadata) for Hugging Face LeRobot"

# The structure below is a directory tree (groups = folders, datasets = files).
# It is used for the preview only; the writer is relay_d/.../lerobot_writer.py.
output_structure:
  root_groups:
    - name: "meta"
      description: "Dataset metadata"
      datasets:
        - name: "info.json"
          dtype: "json"
          shape: "-"
          description: "codebase_version v3.0, fps, features (state/action/cameras), totals, path templates, splits"
        - name: "stats.json"
          dtype: "json"
          shape: "-"
          description: "Global min/max/mean/std/count/quantiles per feature (used for normalization)"
        - name: "tasks.parquet"
          dtype: "parquet"
          shape: "[num_tasks, 2]"
          description: "Task text -> task_index"
      groups:
        - name: "episodes/chunk-000/file-000.parquet"
          description: "One row per episode: length, tasks, data/video file + frame/time offsets, per-episode stats"
    - name: "data"
      description: "Frame-by-frame tabular data, many episodes per file"
      groups:
        - name: "chunk-000/file-000.parquet"
          description: "Columns below; files roll over at ~100 MB"
          datasets:
            - name: "observation.state"
              dtype: "float32"
              shape: "[num_frames, state_dim]"
              description: "Numeric output.streams concatenated in declaration order (column names in info.json)"
            - name: "action"
              dtype: "float32"
              shape: "[num_frames, action_dim]"
              description: "Built from actions_to_extract (same as the robomimic actions)"
            - name: "timestamp"
              dtype: "float32"
              shape: "[num_frames]"
              description: "frame_index / fps (seconds within the episode)"
            - name: "frame_index, episode_index, index, task_index"
              dtype: "int64"
              shape: "[num_frames]"
              description: "Frame within episode, episode id, global frame id, task id"
    - name: "videos"
      description: "One mp4 per camera, many episodes per file (located by from/to_timestamp in meta/episodes)"
      groups:
        - name: "observation.images.<camera>/chunk-000/file-000.mp4"
          description: "H.264, yuv420p, RGB frames from the image bridge-map entries; files roll over at ~200 MB"
